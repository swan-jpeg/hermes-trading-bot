# Hermes Trading Bot — runtime-instellingen (geen secrets; die gaan in .env)
universe:
  # Start klein: high-liquidity assets. Uitbreiden na validatie.
  stocks:
    - AAPL
    - MSFT
    - NVDA
    - JPM
  etfs:
    - SPY
    - QQQ
    - EFA
  bonds:
    - AGG
  cash: USD
  regiones: [US, EU, JP]

data:
  market_feed: yfinance   # yfinance | polygon | alpaca
  storage: postgres       # postgres | sqlite (dev)
  sqlite_path: var/tradingbot.db

# Webscraping routes voor de 24/7 server.
# Zet enabled: true om constant naar het web te kijken (speeches, reports, alerts).
# server is te zwak om de zware modellen (whisper/DeepFace) te draaien -> offline.
webscraping:
  enabled: false          # MASTER-knop: zet op true om alle routes aan te zetten
  routes:
    speech:
      enabled: false      # speeches van CEO's/landsleiders (RSS nieuws)
      interval_sec: 3600  # elk uur
    reports:
      enabled: false      # quarterly reports + overheidsuitgaven
      interval_sec: 86400 # dagelijks
    alerts:
      enabled: false      # nieuws-alerts + point-loops
      interval_sec: 600   # elke 10 min

fusion:
  sources: [audiovisual, speech, report, alert, regional, bottleneck, agent, market]
  weigh_by_credibility: true

risk:
  max_portfolio_drawdown: -0.08   # risk-off trigger
  max_asset_weight: 0.10          # per asset
  max_sector_risk: 0.20           # per sector/cluster
  max_leverage: 0.0               # geen hefboom start
  vol_target: 0.125               # annualized vol doel
  cash_min_in_crash: 0.30

rl:
  algo: PPO           # PPO | SAC | CQL (offline)
  reward_lam_drawdown: 0.5
  reward_lam_turnover: 0.02
  train_steps: 100000
  seed: 42

execution:
  mode: paper          # paper | live
  broker: alpaca       # alpaca | ibkr
  fail_closed: true

monitoring:
  metrics_every_sec: 60
  alert_channel: tui
