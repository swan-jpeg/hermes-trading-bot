# Hermes Trading Bot — runtime settings (no secrets; those go in .env)
universe:
  # Start small: high-liquidity assets. Expand after validation.
  stocks:
    - AAPL
    - MSFT
    - NVDA
    - JPM
  etfs:
    - SPY
    - QQQ
    - EFA
  bonds:
    - AGG
  cash: USD
  regions: [US, EU, JP]

data:
  market_feed: yfinance   # yfinance | polygon | alpaca
  storage: postgres       # postgres | sqlite (dev)
  sqlite_path: var/tradingbot.db

# Webscraping routes for the 24/7 server.
# Set enabled: true to constantly watch the web (speeches, reports, alerts).
# The server is too weak to run the heavy models (whisper/DeepFace) -> offline.
webscraping:
  enabled: false          # MASTER switch: set to true to enable all routes
  routes:
    speech:
      enabled: false      # speeches from CEOs/world leaders (RSS news)
      interval_sec: 3600  # every hour
    reports:
      enabled: false      # quarterly reports + government spending
      interval_sec: 86400 # daily
    alerts:
      enabled: false      # news alerts + point loops
      interval_sec: 600   # every 10 min

fusion:
  sources: [audiovisual, speech, report, alert, regional, bottleneck, agent, market]
  weigh_by_credibility: true

risk:
  max_portfolio_drawdown: -0.08   # risk-off trigger
  max_asset_weight: 0.10          # per asset
  max_sector_risk: 0.20           # per sector/cluster
  max_leverage: 0.0               # no leverage to start
  vol_target: 0.125               # annualized vol target
  cash_min_in_crash: 0.30

rl:
  algo: PPO           # PPO | SAC | CQL (offline)
  reward_lam_drawdown: 0.5
  reward_lam_turnover: 0.02
  train_steps: 100000
  seed: 42

execution:
  mode: paper          # paper | live
  broker: alpaca       # alpaca | ibkr
  fail_closed: true

monitoring:
  metrics_every_sec: 60
  alert_channel: tui
