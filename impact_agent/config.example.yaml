# Impact Agent config — kopieer naar config/config.yaml (of .env voor secrets).
# Secrets (API-keys) gaan ALTIJD in .env, nooit in config.yaml.

# Gebruik de LLM-impact-agent (true) of alleen keyword-matching (false).
impact_use_llm: false

# Gratis model via OpenRouter (of een eigen getraind model-id).
impact_llm_model: meta-llama/llama-3.1-8b-instruct:free

# Timeout voor de LLM-call (seconden).
impact_llm_timeout: 30
