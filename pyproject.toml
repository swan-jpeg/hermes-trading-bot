[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-trading-bot"
version = "0.1.0"
description = "Modulaire multi-asset AI trading-bot (Hermes)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
    "numpy>=1.26,<2",
    "pandas>=2.1,<3",
    "pandas-stubs>=2.1,<3",
    "pyyaml>=6.0,<7",
    "rich>=13,<14",
    "fire>=0.5,<1",
]

[project.optional-dependencies]
data = [
    "yfinance>=0.2,<1",
    "polygon-api-client>=1.13,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
]
ml = [
    "scikit-learn>=1.3,<2",
    "stable-baselines3>=2.1,<3",
    "gymnasium>=0.29,<1",
]
risk = [
    "scipy>=1.11,<2",
]
dev = [
    "pytest>=7.4,<9",
    "ruff>=0.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["hermes_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"hermes_bot/webui.py" = ["E501"]
